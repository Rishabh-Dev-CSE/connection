{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8034689723711025"
        crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-8034689723711025">
    <link rel="stylesheet" href="{% static  'css/font-owsome.css' %}">
    <link rel="stylesheet" href="{% static  'css/style.css' %}">
    <title>Canvas Drawing</title>
    <style>

    </style>
</head>

<body>

    <div id="tools">
        <button id="action-function"></button>
        <label for="color">color</label>
        <input type="color" id="color" value="#000000">
        <input type="number" id="size" value="2" min="1" max="10">
        <button onclick="clearCanvas()">Trash</button>
        <button><i class="fa-solid fa-floppy-disk"></i></button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <script>

        function goFull() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else {
                document.documentElement.requestPointerLock
            }
        }
    </script>
    <script src="{% static 'js/writer/writer.js' %}"></script>
</body>

</html>
