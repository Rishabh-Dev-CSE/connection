{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Board View</title>
  <!-- Ads (UNCHANGED) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8034689723711025"
    crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-8034689723711025">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ===== LAYOUT ===== */
    .board-wrapper {
      width: 96vw;
      height: 92vh;
      position: relative;
    }

    /* ===== CANVAS FRAME ===== */
    .board-frame {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 22px;
      box-shadow:
        0 50px 100px rgba(0,0,0,.55),
        inset 0 0 0 1px rgba(0,0,0,.05);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: default;
    }

    /* ===== TOP LABEL ===== */
    .board-label {
      position: absolute;
      top: -14px;
      left: 24px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      color: #e5e7eb;
      letter-spacing: .3px;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    /* ===== STATUS DOT ===== */
    .status {
      position: absolute;
      top: 16px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #cbd5f5;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* ===== FOOTER BRAND ===== */
    .board-footer {
      position: absolute;
      bottom: 18px;
      right: 24px;
      font-size: 12px;
      color: rgba(255,255,255,.55);
    }

    /* ===== MOBILE ===== */
    @media(max-width: 768px) {
      .board-wrapper {
        width: 100vw;
        height: 100vh;
      }

      .board-frame {
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="board-wrapper">

    <div class="board-label">Live Board View</div>

    <div class="status">
      <div class="dot"></div>
      Receiving Data
    </div>

    <div class="board-frame">
      <canvas id="canvas"></canvas>
    </div>

    <div class="board-footer">Read-Only Board</div>

  </div>

  <!-- JS only renders received data -->
  <script src="{% static 'js/writer/board.js' %}"></script>
</body>
</html>
