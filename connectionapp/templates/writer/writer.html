{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writer Board</title>
  <!-- Ads (UNCHANGED) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8034689723711025"
    crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-8034689723711025">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#1e293b,#020617);
  overflow:hidden;
}

/* ===== TOGGLE BUTTON ===== */
#toggleTools{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:4px 10px;
  height:22px;
  border-radius:8px;
  border:none;
  background:rgba(255,255,255,.9);
  color:#000;
  font-size:14px;
  cursor:pointer;
  z-index:20;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

/* ===== TOOLBAR ===== */
#tools{
  position:fixed;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  border-radius:14px;
  box-shadow:0 18px 35px rgba(0,0,0,.45);
  z-index:10;
  transition:.3s ease;
}

#tools.hidden{
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,-15px);
}

/* Labels */
#tools label{
  font-size:12px;
  color:#000;
  opacity:.75;
}

/* Color */
#color{
  width:30px;
  height:30px;
  border:none;
  background:none;
}

/* Size */
#size{
  width:50px;
  height:30px;
  border-radius:8px;
  border:none;
  background:rgba(255,255,255,.2);
  color:#000;
  padding:0 6px;
}

/* Clear */
#tools button{
  height:30px;
  padding:0 12px;
  border-radius:8px;
  border:none;
  background:#ef4444;
  color:#fff;
  font-size:12px;
}

/* ===== CANVAS ===== */
canvas{
  width:100vw;
  height:100vh;
  background:white;
  display:block;
  cursor:crosshair;
}

/* ===== STATUS ===== */
.status{
  position:fixed;
  bottom:12px;
  right:14px;
  font-size:11px;
  color:rgba(255,255,255,.6);
}

/* ===== MOBILE ===== */
@media (max-width: 600px){
  #tools{
    gap:8px;
    padding:10px 12px;
  }

  #size{
    width:44px;
  }

  .status{
    font-size:10px;
  }
}

/* ===== TABLET ===== */
@media (min-width: 601px) and (max-width: 1024px){
  #tools{
    padding:12px 14px;
  }
}

/* ===== LARGE SCREENS ===== */
@media (min-width: 1600px){
  #tools{
    transform:translateX(-50%) scale(1.05);
  }
}
</style>
</head>

<body>

<!-- TOGGLE -->
<button id="toggleTools">▲</button>

<!-- TOOLS -->
<div id="tools">
  <label>Color</label>
  <input type="color" id="color" value="#000000">

  <label>Size</label>
  <input type="number" id="size" value="3" min="1" max="30">

  <button onclick="clearCanvas()">Clear</button>
</div>

<!-- CANVAS -->
<canvas id="canvas"></canvas>

<div class="status">Live Writing • Sync Enabled</div>

<script src="{% static 'js/writer/writer.js' %}"></script>

<script>
  const toggleBtn = document.getElementById("toggleTools");
  const tools = document.getElementById("tools");

  let open = true;

  toggleBtn.addEventListener("click", () => {
    open = !open;
    tools.classList.toggle("hidden", !open);
    toggleBtn.textContent = open ? "▲" : "▼";
  });
</script>

</body>
</html>
