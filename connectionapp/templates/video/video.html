<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Room</title>
  <!-- Ads (UNCHANGED) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8034689723711025"
    crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-8034689723711025">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  margin:0;
  height:100vh;
  background:radial-gradient(circle at top,#111827,#020617);
  color:white;
  overflow:hidden;
}

/* ===== HEADER ===== */
.header{
  padding:14px;
  text-align:center;
  font-size:18px;
  font-weight:600;
}

/* ===== VIDEO AREA ===== */
.video-area{
  height:calc(100vh - 120px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  padding:20px;
}

/* ===== VIDEO CARD ===== */
.video-card{
  position:relative;
  width:320px;
  max-width:100%;
  aspect-ratio:4/3;
  background:black;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.video-card video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Name Tag */
.name{
  position:absolute;
  bottom:8px;
  left:10px;
  background:rgba(0,0,0,.6);
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}

/* ===== CONTROLS ===== */
.controls{
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
}

.controls button{
  padding:12px 22px;
  border-radius:30px;
  border:none;
  font-size:14px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  transition:.2s;
}

.controls button:hover{
  transform:translateY(-1px);
}

.controls .danger{
  background:#dc2626;
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .video-area{
    flex-direction:column;
    gap:14px;
  }

  .video-card{
    width:100%;
    max-width:360px;
    aspect-ratio:16/9;
  }

  .controls{
    bottom:10px;
  }
}

/* ===== LARGE SCREENS ===== */
@media(min-width:1200px){
  .video-card{
    width:420px;
  }
}
</style>
</head>

<body>

<div class="header">Video Room</div>

<div class="video-area">

  <!-- MY CAMERA -->
  <div class="video-card">
    <video id="localVideo" autoplay muted playsinline></video>
    <div class="name">You</div>
  </div>

  <!-- REMOTE CAMERA -->
  <div class="video-card">
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="name">Remote</div>
  </div>

</div>

<!-- CONTROLS -->
<div class="controls">
  <button onclick="startCall()">Start Call</button>

</div>

<script src="/static/js/video.js"></script>
</body>
</html>
